[project]
name = "gui-agent"
version = "0.2.0"
description = "Safe desktop perception and control foundations for a GUI agent"
readme = "README.md"
authors = [
    { name = "Beichen-Ji", email = "bji7@uwo.ca" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "mss>=10.1,<11",
    "numpy>=2,<3",
    "opencv-python-headless>=4.11,<5",
    "pillow>=11,<13",
    "pyautogui>=0.9.54,<1",
    "pynput>=1.8,<2",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7.2,<2",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
]

[project.scripts]
gui-agent = "gui_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a real desktop, GPU, model download, or external resource",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["cv2", "easyocr", "mss", "mss.*", "pyautogui", "pynput", "pynput.*", "torch"]
ignore_missing_imports = true
