name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install base, development, and agent dependencies
        run: uv sync --locked --group dev --extra agent

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests examples scripts

      - name: Test without desktop or model access
        run: >-
          uv run pytest -m "not integration"
          --cov=gui_agent
          --cov-report=term-missing
          --cov-report=xml
